<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Farm & Blue Remounts Management System</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0B1F3A 0%, #123B6B 55%, #1E63A8 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 26px;
      }
      .splash-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px dashed #D4AF37;
        opacity: 0.6;
      }
      .splash-logo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #D4AF37;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.45);
      }
      .splash-title {
        font-family: Arial, "Segoe UI", sans-serif;
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin: 0 0 6px;
        text-align: center;
      }
      .splash-subtitle {
        font-family: Arial, "Segoe UI", sans-serif;
        color: rgba(255,255,255,0.75);
        font-size: 13px;
        margin: 0 0 26px;
        text-align: center;
      }
      .splash-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.18);
        border-top-color: #D4AF37;
        animation: splash-spinner-rotate 0.8s linear infinite;
      }
      @keyframes splash-spinner-rotate {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-logo-wrap">
        <div class="splash-ring"></div>
        <img id="splash-logo-img" class="splash-logo" src="/blue-farm-logo.png" alt="Blue Farm" />
      </div>
      <p class="splash-title">Blue Farm &amp; Blue Remounts</p>
      <p class="splash-subtitle">Human Resource &amp; Finance Management System</p>
      <div class="splash-spinner"></div>
    </div>
    <script>
      // Show the right farm's logo in the single splash circle (Blue Remounts
      // if that's the last-selected farm, Blue Farm by default before any
      // farm has been chosen yet).
      try {
        var savedFarm = window.localStorage.getItem("farm");
        if (savedFarm === "Blue Remounts") {
          document.getElementById("splash-logo-img").src = "/blue-remounts-logo.png";
          document.getElementById("splash-logo-img").alt = "Blue Remounts";
        }
      } catch (e) { /* localStorage unavailable — keep default logo */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
